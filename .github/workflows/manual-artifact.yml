name: manual-artifact

on: [ workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew build

      - name: List build output
        run: |
          echo "=== Root build/libs ==="
          ls -R build/libs 2>/dev/null || echo "root build/libs not found"
          echo "=== All build/libs directories ==="
          find . -type d -name "libs" -path "*/build/*" 2>/dev/null
          echo "=== All JAR files ==="
          find . -name "*.jar" -type f 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxy-artifacts
          path: build/libs/*.jar
          archive: false
